name: Build DYYYAlbum dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build
        run: make clean all FINALPACKAGE=1

      - name: Collect dylib
        run: |
          mkdir -p output
          cp .theos/obj/arm64/DYYYAlbum.dylib output/arm64.dylib
          cp .theos/obj/arm64e/DYYYAlbum.dylib output/arm64e.dylib
          LIPO=""
          if command -v lipo >/dev/null 2>&1; then LIPO=lipo; fi
          if [ -z "$LIPO" ] && command -v llvm-lipo >/dev/null 2>&1; then LIPO=llvm-lipo; fi
          if [ -n "$LIPO" ]; then
            "$LIPO" -create output/arm64.dylib output/arm64e.dylib -output output/DYYYAlbum.dylib
          else
            cp output/arm64.dylib output/DYYYAlbum.dylib
          fi
          file output/*.dylib
          ls -l output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYYYAlbum-dylib
          path: output/*.dylib
          if-no-files-found: error
